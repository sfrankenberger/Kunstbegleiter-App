name: Tests

# Laeuft bei Pushes auf main und staging sowie bei jedem Pull Request (siehe CLAUDE.md, Abschnitt CI).
# Feature-Branches ohne PR laufen nicht, Branches mit PR nur einmal (ueber pull_request).
on:
  push:
    branches: [main, staging]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'

# Schnelle Folge-Pushes brechen den aelteren Lauf ab.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pest:
    name: Pest (PHP 8.5)
    # Repo-Variable CI_RUNNER=self-hosted schaltet auf den eigenen Runner auf srv.iksf.de um.
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # Nur auf GitHub-Runnern. Auf dem eigenen Runner kommt PHP 8.5 (Plesk) aus dem PATH.
      - name: Setup PHP
        if: runner.environment == 'github-hosted'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, intl, bcmath, sqlite3, pdo_sqlite, gd, zip
          coverage: none

      - name: Show PHP version
        run: php -v

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-8.5-${{ hashFiles('composer.lock') }}
          restore-keys: composer-8.5-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Check code style
        run: ./vendor/bin/pint --test

      - name: Run tests
        run: ./vendor/bin/pest --ci
